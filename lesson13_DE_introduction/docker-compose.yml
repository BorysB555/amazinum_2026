version: '3.8'
services:
  db:
    image: postgres:15
    container_name: de_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: homework
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d homework"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: de_etl_script
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=postgresql://user:password@db:5432/homework
    volumes:
      - ./output:/app/output
      - ./analytics:/app/analytics